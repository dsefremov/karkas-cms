parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Karkas\:
        resource: '../src/'
        exclude:
            - '../src/Domain/'

    Karkas\Application\Package\:
        resource: '../src/Application/Package/'

    Karkas\Adapters\Infrastructure\Package\:
        resource: '../src/Adapters/Infrastructure/Package/'

    Karkas\Adapters\Entry\Http\Controller\:
        resource: '../src/Adapters/Entry/Http/Controller/'
        tags: ['controller.service_arguments']

    Karkas\Adapters\Infrastructure\Persistence\MysqlConnectivityProbe:
        public: true

    Karkas\Application\Package\Manifest\JsonSchemaManifestValidator:
        arguments:
            $schemaPath: '%karkas.manifest.schema_path%'

    Karkas\Application\Package\Inventory\PlatformVersionInventory:
        arguments:
            $coreVersion: '%karkas.platform.core_version%'
            $sdkVersion: '%karkas.platform.sdk_version%'
            $localCatalogDir: '%karkas.platform.package_catalog_dir%'
