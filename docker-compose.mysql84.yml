# Override for local MySQL 8.4 matrix cell (see README).
services:
  mysql:
    image: mysql:8.4
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: karkas
      MYSQL_USER: karkas
      MYSQL_PASSWORD: karkas_secret

  app:
    environment:
      DATABASE_URL: mysql://karkas:karkas_secret@host.docker.internal:3306/karkas?serverVersion=8.4&charset=utf8mb4

  cli:
    environment:
      DATABASE_URL: mysql://karkas:karkas_secret@host.docker.internal:3306/karkas_test?serverVersion=8.4&charset=utf8mb4
